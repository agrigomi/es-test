# --- Project Info ---
PROJECT_NAME           = "IPC Project"
OUTPUT_DIRECTORY       = ./docs

# --- Input Files ---
# Explicitly including your requested files
INPUT                  = README.md \
                         src/libipc.h \
                         src/proto.h

# This makes the content of README.md appear on the main index page
USE_MDRAP_AS_MAINPAGE  = README.md

# --- Parsing Options ---
# Since your files are .h, optimize for C/C++ style
FILE_PATTERNS          = *.h *.md
RECURSIVE              = NO
SOURCE_BROWSER         = YES
OPTIMIZE_OUTPUT_FOR_C  = YES

# --- Output Formats ---
GENERATE_HTML          = YES
HTML_OUTPUT            = html
GENERATE_LATEX         = NO

# --- Extraction Settings ---
EXTRACT_ALL            = YES
EXTRACT_STATIC         = YES

